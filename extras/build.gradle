plugins { id 'net.neoforged.moddev' }
apply from: rootProject.file('gradle/module-common.gradle')
apply from: rootProject.file('gradle/module-test.gradle')
base { archivesName = 'starfold_extras' }
repositories { mavenCentral() }
neoForge {
    version = rootProject.neoForge.version
    mods { starfold_extras { sourceSet sourceSets.main } }
}
dependencies {
    testImplementation(testFixtures(project(':worlds'))) { transitive = false }
    implementation(project(':')) { transitive = false }
    implementation(project(':worlds')) { transitive = false }
    compileOnly files(rootProject.configurations.compileClasspath)
    testCompileOnly files(rootProject.configurations.testCompileClasspath)
}
apply from: rootProject.file('gradle/core-test-launcher.gradle')

def presetPath = 'data/starfold_worlds/worldgen/world_preset/experience.json'
def worldsPreset = rootProject.file("worlds/src/main/resources/${presetPath}")
def generatedPresets = layout.buildDirectory.dir('generated/extras-presets')
def extrasPreset = generatedPresets.map { it.file(presetPath) }
def generateExtrasPreset = tasks.register('generateExtrasPreset') {
    inputs.file(worldsPreset).withPathSensitivity(PathSensitivity.NONE)
    outputs.file(extrasPreset)
    doLast {
        def preset = new groovy.json.JsonSlurper().parse(worldsPreset)
        preset.dimensions['starfold:native_planet'].generator.starter_ship = [structure: 'starfold_extras:starter_ship']
        def target = extrasPreset.get().asFile
        target.parentFile.mkdirs()
        target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(preset)) + '\n', 'UTF-8')
    }
}
sourceSets.main.resources.srcDir(files(generatedPresets).builtBy(generateExtrasPreset))
tasks.named('test', Test) {
    inputs.file(extrasPreset).withPropertyName('extrasPreset').withPathSensitivity(PathSensitivity.NONE)
    systemProperty 'starfold.extrasPreset', extrasPreset.get().asFile.absolutePath
}
