[[mods]]
modId="starfold"
version="${version}"
displayName="Starfold"
description='''Planets you can walk all the way around, built from real Minecraft chunks, and a sea of stars to cross between them. Build a ship with Sable, leave the ground and fly to another planet. Suns, planets and planet types can be defined in datapacks. Planets need the vanilla renderer: shader packs are not supported.'''

